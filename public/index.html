<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLASS FEEDBACK</title>
<style>
  :root { --bg:#f5f6fa; --card:#fff; --ink:#1d1f2b; --accent:#4f46e5; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; }
  header { display:flex; justify-content:space-between; align-items:center; padding:16px 24px; }
  h1 { font-size:1.25rem; letter-spacing:.15em; margin:0; }
  main { max-width:560px; margin:0 auto; padding:24px 20px 60px; text-align:center; }
  h2 { font-size:1.6rem; margin:40px 0 28px; }
  button { font:inherit; cursor:pointer; border:0; border-radius:14px; }
  .link { background:var(--card); padding:8px 16px; font-size:.9rem; box-shadow:0 1px 4px #0001; }
  .votes { display:flex; gap:14px; justify-content:center; flex-wrap:wrap; }
  .vote { background:var(--card); padding:26px 22px; min-width:140px; font-size:1.2rem; box-shadow:0 2px 10px #0001; transition:transform .12s; }
  .vote:hover { transform:translateY(-3px); }
  .vote:disabled { opacity:.5; cursor:default; transform:none; }
  .vote span { display:block; font-size:2.6rem; margin-bottom:6px; }
  #msg { margin-top:28px; min-height:1.5em; color:var(--accent); font-weight:600; }
  #msg.err { color:#d33; }
  .card { background:var(--card); border-radius:18px; padding:24px; box-shadow:0 2px 10px #0001; text-align:left; }
  input { width:100%; padding:12px; margin:6px 0 12px; border:1px solid #d9dbe5; border-radius:10px; font:inherit; }
  .primary { background:var(--accent); color:#fff; padding:12px 20px; width:100%; }
  .total { text-align:center; font-size:1.1rem; margin-bottom:18px; }
  .row { margin:14px 0; }
  .row .label { display:flex; justify-content:space-between; font-size:.95rem; margin-bottom:6px; }
  .track { background:#eceef6; border-radius:8px; height:22px; overflow:hidden; }
  .bar { height:100%; width:0; background:var(--accent); transition:width .4s; }
  .actions { display:flex; gap:10px; margin-top:22px; flex-wrap:wrap; }
  .actions button { flex:1; padding:10px 14px; background:#eceef6; }
  .actions .danger { background:#fde8e8; color:#c22; }
  [hidden] { display:none !important; }
</style>
</head>
<body>
<header>
  <h1>CLASS FEEDBACK</h1>
  <button id="loginBtn" class="link">관리자 로그인</button>
</header>
<main>
  <section id="studentView">
    <h2>오늘 수업은 어땠나요?</h2>
    <div class="votes">
      <button class="vote" data-rating="satisfied"><span>😊</span>만족</button>
      <button class="vote" data-rating="neutral"><span>😐</span>보통</button>
      <button class="vote" data-rating="dissatisfied"><span>😞</span>불만족</button>
    </div>
    <div id="msg"></div>
  </section>

  <section id="loginView" hidden>
    <div class="card">
      <form id="loginForm">
        <label>이메일<input type="email" id="email" required autocomplete="username"></label>
        <label>비밀번호<input type="password" id="password" required autocomplete="current-password"></label>
        <button class="primary" type="submit">로그인</button>
        <div id="loginMsg" style="color:#d33;margin-top:10px"></div>
      </form>
      <div class="actions"><button id="backBtn" type="button">돌아가기</button></div>
    </div>
  </section>

  <section id="adminView" hidden>
    <div class="card">
      <div class="total">전체 투표 수: <b id="total">0</b></div>
      <div class="row"><div class="label"><span>😊 만족</span><span id="t-satisfied"></span></div><div class="track"><div class="bar" id="b-satisfied"></div></div></div>
      <div class="row"><div class="label"><span>😐 보통</span><span id="t-neutral"></span></div><div class="track"><div class="bar" id="b-neutral"></div></div></div>
      <div class="row"><div class="label"><span>😞 불만족</span><span id="t-dissatisfied"></span></div><div class="track"><div class="bar" id="b-dissatisfied"></div></div></div>
      <div class="actions">
        <button id="refreshBtn">결과 새로고침</button>
        <button id="resetBtn" class="danger">투표 결과 초기화</button>
        <button id="logoutBtn">로그아웃</button>
      </div>
      <div id="adminMsg" style="margin-top:12px;color:#d33"></div>
    </div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
